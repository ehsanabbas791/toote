<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>عجلة الحظ - Toote </title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c;
    --surface:#141318;
    --surface-2:#1c1b21;
    --gold:#d4af37;
    --gold-light:#f3e0a0;
    --gold-dark:#8a621f;
    --burgundy:#6e1f28;
    --charcoal:#201f26;
    --cream:#f3ecd9;
    --muted:#9c96a4;
    --disabled:#3a3940;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--cream);
    font-family:'Cairo', 'Segoe UI', Tahoma, sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:22px 16px 32px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:2px;
  }

  .brand .mark{
    width:26px;
    height:26px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, var(--gold-light), var(--gold) 55%, var(--gold-dark) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
  }

  .brand span{
    font-weight:800;
    font-size:15px;
    letter-spacing:.5px;
    background:linear-gradient(135deg, var(--gold-light), var(--gold) 45%, var(--gold-dark));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  h1{
    font-size:20px;
    font-weight:700;
    margin:6px 0 22px;
    color:var(--cream);
  }

  .wheel-wrap{
    position:relative;
    width:min(78vw, 320px);
    height:min(78vw, 320px);
    margin-bottom:22px;
  }

  .pointer{
    position:absolute;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:24px solid var(--gold);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));
    z-index:5;
  }

  .rim{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--gold-light), var(--gold), var(--gold-dark), var(--gold), var(--gold-light));
    padding:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.08);
  }

  .rim-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    background:var(--bg);
    padding:6px;
  }

  #wheelGroup{
    width:100%;
    height:100%;
    transition:transform 4.2s cubic-bezier(.12,.67,.1,1);
    transform:rotate(0deg);
  }

  #wheelGroup.dim path{ opacity:.35; }
  #wheelGroup.dim text{ opacity:.35; }

  .hub{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:22%;
    height:22%;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #8e2731, var(--burgundy) 60%, #430f16 100%);
    border:3px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,.5);
    cursor:pointer;
    z-index:4;
  }

  .hub span{
    font-size:11px;
    font-weight:800;
    color:var(--gold-light);
    letter-spacing:.5px;
  }

  .hub.disabled{
    cursor:default;
    filter:grayscale(.6) brightness(.7);
  }

  .status{
    min-height:20px;
    text-align:center;
    font-size:14px;
    color:var(--muted);
    margin-bottom:14px;
    line-height:1.7;
  }

  .status b{ color:var(--gold-light); font-weight:700; }

  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    width:min(84vw, 320px);
    padding:14px 20px;
    border-radius:14px;
    font-family:inherit;
    font-size:16px;
    font-weight:800;
    text-align:center;
    transition:transform .15s ease, opacity .15s ease;
  }

  .btn:active{ transform:scale(.97); }

  .btn-primary{
    background:linear-gradient(135deg, var(--gold-light), var(--gold) 50%, var(--gold-dark));
    color:#241a06;
  }

  .btn-primary:disabled{
    background:var(--disabled);
    color:var(--muted);
    cursor:default;
  }

  .divider{
    width:min(84vw, 320px);
    display:flex;
    align-items:center;
    gap:10px;
    margin:22px 0 14px;
    color:var(--muted);
    font-size:12px;
  }

  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(212,175,55,.35), transparent);
  }

  .btn-ghost{
    background:transparent;
    border:1.5px solid var(--gold-dark);
    color:var(--gold-light);
  }

  .trial-note{
    max-width:min(84vw, 320px);
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-top:10px;
    line-height:1.7;
  }

  .result{
    position:fixed;
    inset:0;
    background:rgba(6,6,8,.86);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:20;
  }

  .result.show{ display:flex; }

  .result-card{
    width:100%;
    max-width:320px;
    background:var(--surface);
    border:1px solid rgba(212,175,55,.35);
    border-radius:20px;
    padding:28px 22px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
  }

  .result-icon{ font-size:44px; margin-bottom:10px; }

  .result-title{
    font-size:19px;
    font-weight:800;
    color:var(--gold-light);
    margin-bottom:6px;
  }

  .result-prize{
    font-size:16px;
    font-weight:700;
    color:var(--cream);
    margin-bottom:10px;
  }

  .result-sub{
    font-size:13px;
    color:var(--muted);
    margin-bottom:22px;
    line-height:1.7;
  }

  .error-box{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:40px 20px;
    line-height:1.8;
  }
</style>
</head>
<body>

  <div class="brand">
    <div class="mark">🂡</div>
    <span>SCARFACE</span>
  </div>
  <h1>🎡 عجلة الحظ</h1>

  <div id="app"></div>

  <div class="result" id="resultOverlay">
    <div class="result-card">
      <div class="result-icon" id="resultIcon">🎉</div>
      <div class="result-title" id="resultTitle">مبروك!</div>
      <div class="result-prize" id="resultPrize"></div>
      <div class="result-sub" id="resultSub"></div>
      <button class="btn btn-primary" id="closeBtn">إغلاق</button>
    </div>
  </div>

<script>
(function(){
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  const app = document.getElementById("app");

  function parsePayload(){
    try{
      const params = new URLSearchParams(window.location.search);
      const raw = params.get("data");
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || !Array.isArray(obj.labels) || obj.labels.length === 0) return null;
      return obj;
    }catch(e){
      return null;
    }
  }

  function showError(){
    app.innerHTML = '<div class="error-box">⚠️ تعذّر تحميل العجلة.<br>الرجاء العودة للبوت والضغط على "🆓 اللفة المجانية" مجدداً.</div>';
  }

  const SEGMENT_COLORS = ["#6e1f28", "#201f26"];

  function wrapLabel(label, maxCharsPerLine){
    const words = label.split(" ").filter(Boolean);
    const lines = [];
    let current = "";

    for (const word of words){
      const candidate = current ? current + " " + word : word;
      if (candidate.length > maxCharsPerLine && current){
        lines.push(current);
        current = word;
      } else {
        current = candidate;
      }
    }
    if (current) lines.push(current);

    return lines.slice(0, 3);
  }

  function buildWheelSVG(labels){
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 500 500");
    svg.setAttribute("id", "wheelGroup");

    const n = labels.length;
    const anglePer = 360 / n;
    const cx = 250, cy = 250, R = 244;

    let maxCharsPerLine = 14;
    if (n > 4) maxCharsPerLine = 11;
    if (n > 6) maxCharsPerLine = 9;
    if (n > 8) maxCharsPerLine = 7;

    const fontSize = n > 8 ? 13 : (n > 6 ? 14 : (n > 4 ? 16 : 18));
    const lineHeight = fontSize * 1.18;

    for (let i = 0; i < n; i++){
      const startAngle = i * anglePer - 90;
      const endAngle = startAngle + anglePer;
      const startRad = startAngle * Math.PI/180;
      const endRad = endAngle * Math.PI/180;

      const x1 = cx + R * Math.cos(startRad);
      const y1 = cy + R * Math.sin(startRad);
      const x2 = cx + R * Math.cos(endRad);
      const y2 = cy + R * Math.sin(endRad);
      const largeArc = anglePer > 180 ? 1 : 0;

      const path = document.createElementNS(svgNS, "path");
      path.setAttribute("d", `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${R} ${R} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`);
      path.setAttribute("fill", SEGMENT_COLORS[i % 2]);
      path.setAttribute("stroke", "#d4af37");
      path.setAttribute("stroke-width", "2");
      svg.appendChild(path);

      const midAngle = startAngle + anglePer/2;
      const midRad = midAngle * Math.PI/180;
      const labelR = R * 0.62;
      const lx = cx + labelR * Math.cos(midRad);
      const ly = cy + labelR * Math.sin(midRad);

      const lines = wrapLabel(labels[i], maxCharsPerLine);
      const blockOffset = -((lines.length - 1) * lineHeight) / 2;

      const text = document.createElementNS(svgNS, "text");
      text.setAttribute("x", lx.toFixed(2));
      text.setAttribute("y", ly.toFixed(2));
      text.setAttribute("fill", "#f3ecd9");
      text.setAttribute("font-size", String(fontSize));
      text.setAttribute("font-weight", "700");
      text.setAttribute("font-family", "Cairo, sans-serif");
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("transform", `rotate(${(midAngle+90).toFixed(2)}, ${lx.toFixed(2)}, ${ly.toFixed(2)})`);

      lines.forEach((line, idx) => {
        const tspan = document.createElementNS(svgNS, "tspan");
        tspan.setAttribute("x", lx.toFixed(2));
        tspan.setAttribute("dy", idx === 0 ? `${blockOffset.toFixed(2)}` : `${lineHeight.toFixed(2)}`);
        tspan.textContent = line;
        text.appendChild(tspan);
      });

      svg.appendChild(text);
    }

    return svg;
  }

  function computeRotation(index, n, currentTotal){
    const anglePer = 360 / n;
    let centerAngle = (index + 0.5) * anglePer - 90;
    centerAngle = ((centerAngle % 360) + 360) % 360;
    const needed = (270 - centerAngle + 360) % 360;
    const baseFullSpins = 6;
    const currentMod = ((currentTotal % 360) + 360) % 360;
    let extra = needed - currentMod;
    if (extra < 0) extra += 360;
    return currentTotal + baseFullSpins * 360 + extra;
  }

  function init(payload){
    const labels = payload.labels;
    const n = labels.length;

    app.innerHTML = `
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <div class="rim"><div class="rim-inner" id="svgHost"></div></div>
        <div class="hub" id="hubBtn"><span>ابدأ</span></div>
      </div>
      <div class="status" id="statusText"></div>
      <button class="btn btn-primary" id="mainBtn"></button>
      <div class="divider">أو</div>
      <button class="btn btn-ghost" id="trialBtn">🎡 لفة تجريبية</button>
      <div class="trial-note">اللفة التجريبية مخصصة لتجربة العجلة فقط، وليست حقيقية ولا يُصرف عليها أي جائزة.</div>
    `;

    const svgHost = document.getElementById("svgHost");
    const svg = buildWheelSVG(labels);
    svgHost.appendChild(svg);

    const hubBtn = document.getElementById("hubBtn");
    const mainBtn = document.getElementById("mainBtn");
    const trialBtn = document.getElementById("trialBtn");
    const statusText = document.getElementById("statusText");

    let currentRotation = 0;
    let spinning = false;

    const eligible = !!payload.eligible && Number.isInteger(payload.land);

    if (eligible){
      statusText.innerHTML = "🎁 لديك لفة مجانية جاهزة الآن!";
      mainBtn.textContent = "🎡 لف العجلة الآن";
      mainBtn.disabled = false;
    } else {
      const remaining = payload.remaining || "قريباً";
      statusText.innerHTML = `⏰ التدويرة التالية خلال <b>${remaining}</b>`;
      mainBtn.textContent = "🔒 غير متاحة الآن";
      mainBtn.disabled = true;
      svg.classList.add("dim");
      hubBtn.classList.add("disabled");
    }

    function spin(index, isReal, prizeType){
      if (spinning) return;
      spinning = true;
      mainBtn.disabled = true;
      trialBtn.disabled = true;
      hubBtn.classList.add("disabled");

      currentRotation = computeRotation(index, n, currentRotation);
      svg.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        spinning = false;
        showResult(labels[index], isReal, prizeType);
      }, 4300);
    }

    function showResult(label, isReal, prizeType){
      const overlay = document.getElementById("resultOverlay");
      const icon = document.getElementById("resultIcon");
      const title = document.getElementById("resultTitle");
      const prize = document.getElementById("resultPrize");
      const sub = document.getElementById("resultSub");

      if (isReal){
        prize.textContent = label;

        if (prizeType === "respin"){
          icon.textContent = "🔄";
          title.textContent = "مبروك! لفة إضافية";
          sub.textContent = "ما في داعي تنتظر — رجّع عالبوت وضغط \"🆓 اللفة المجانية\" وجرب حظك فوراً مرة كمان 🎡";
        } else if (prizeType === "custom_message"){
          icon.textContent = "🎁";
          title.textContent = "مبروك!";
          sub.textContent = "📞 هاي جائزة خاصة — تواصل مع الإدارة داخل البوت لاستلامها.";
        } else if (prizeType === "none"){
          icon.textContent = "😔";
          title.textContent = "حظ أوفر";
          sub.textContent = "ما ربحت هالمرة. جرب مرة جديدة بعد انتهاء مدة الانتظار القادمة.";
        } else {
          icon.textContent = "🎉";
          title.textContent = "مبروك!";
          sub.textContent = "✅ تمت إضافة الجائزة إلى رصيدك بالفعل.";
        }
      } else {
        icon.textContent = "🎡";
        title.textContent = "لفة تجريبية";
        prize.textContent = label;
        sub.textContent = "هذه لفة تجريبية فقط ولم يتم صرف أي جائزة. عد لاحقاً لتجربة لفتك الحقيقية!";
      }

      overlay.classList.add("show");

      if (tg && isReal){
        try { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch(e){}
      }
    }

    if (eligible){
      mainBtn.addEventListener("click", () => spin(payload.land, true, payload.prize_type));
      hubBtn.addEventListener("click", () => spin(payload.land, true, payload.prize_type));
    } else {
      trialBtn.addEventListener("click", () => {
        const randomIndex = Math.floor(Math.random() * n);
        spin(randomIndex, false, null);
      });
    }

    if (n === 0){
      trialBtn.style.display = "none";
    } else if (!eligible) {
      trialBtn.addEventListener("click", () => {}, { once:false });
    }
  }

  document.getElementById("closeBtn").addEventListener("click", () => {
    if (tg){ try { tg.close(); return; } catch(e){} }
    document.getElementById("resultOverlay").classList.remove("show");
  });

  const payload = parsePayload();
  if (!payload){
    showError();
  } else {
    init(payload);
  }
})();
</script>
</body>
</html>
